<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Carrera WebSocket</title>
    <style>
        body {
            background: #222;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #game-container {
            position: relative;
            width: 1280px;
            height: 720px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        canvas {
            background: #333;
            display: block;
            border-radius: 4px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        /* Voting Screen */
        .voting-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 20px;
            width: 90%;
        }
        .car-card {
            background: #444;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            position: relative;
        }
        .car-card img {
            width: 50px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
        }
        .vote-count {
            font-size: 18px;
            font-weight: bold;
        }
        .confirmed-badge {
            background: #00cc00;
            color: white;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .car-card.confirmed .confirmed-badge {
            display: block;
        }
        .car-card.confirmed {
            border: 2px solid #00cc00;
        }

        /* Waiting Screen */
        .waiting-msg {
            font-size: 48px;
            text-align: center;
            color: #fff;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Countdown */
        .countdown-text {
            font-size: 150px;
            font-weight: bold;
            color: yellow;
            text-shadow: 4px 4px 0 #000;
        }

        /* Winner */
        .winner-box {
            background: rgba(0, 200, 0, 0.95);
            color: white;
            padding: 20px 50px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 15px;
            border: 5px solid #fff;
            text-shadow: 2px 2px 4px #000;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- Voting Screen -->
    <div id="voting-screen" class="overlay">
        <h1>Elige tu corredor</h1>
        <div class="voting-grid" id="votingGrid"></div>
    </div>

    <!-- Waiting Screen -->
    <div id="waiting-screen" class="overlay hidden">
        <div class="waiting-msg">EN UN MOMENTO COMENZAMOS LA CARRERA</div>
    </div>

    <!-- Countdown Screen (Transparent overlay) -->
    <div id="countdown-screen" class="overlay hidden" style="background: rgba(0,0,0,0.3);">
        <div class="countdown-text" id="countdownDisplay">5</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay hidden" style="background: rgba(0,0,0,0.5);">
        <div class="winner-box" id="winnerBox"></div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Elements
const screens = {
    voting: document.getElementById("voting-screen"),
    waiting: document.getElementById("waiting-screen"),
    countdown: document.getElementById("countdown-screen"),
    winner: document.getElementById("winner-screen")
};
const votingGrid = document.getElementById("votingGrid");
const countdownDisplay = document.getElementById("countdownDisplay");
const winnerBox = document.getElementById("winnerBox");

// Game State
let cars = {};          // Visual objects
let carNames = [];      // Order of lanes
let confirmedCars = [];
let votes = {};
let finish_line = 50;
let start_pos = 650;
let gamePhase = "VOTING";

// Assets
const allCarNames = [
    "argentina", "bolivia", "brasil", "chile", "colombia", "costa_rica", "cuba",
    "ecuador", "el_salvador", "guatemala", "honduras", "mexico", "nicaragua",
    "panama", "paraguay", "peru", "uruguay", "usa", "venezuela"
];

// Initialize Voting Grid
allCarNames.forEach(name => {
    const card = document.createElement("div");
    card.className = "car-card";
    card.id = `card-${name}`;
    card.innerHTML = `
        <img src="sprites/${name}.png" alt="${name}">
        <div>${name.toUpperCase()}</div>
        <div class="vote-count" id="votes-${name}">0</div>
        <div class="confirmed-badge">CONFIRMADO PARA LA CARRERA</div>
    `;
    votingGrid.appendChild(card);
});


// WebSocket
let ws = new WebSocket("ws://localhost:8000/ws");

ws.onmessage = (event) => {
    let msg = JSON.parse(event.data);

    if (msg.type === "state_update") {
        handleStateUpdate(msg);
    } else if (msg.type === "positions") {
        updatePositions(msg.data);
    } else if (msg.type === "countdown") {
        handleCountdown(msg.value);
    } else if (msg.type === "winner") {
        showWinner(msg.data);
    }
};

function handleStateUpdate(state) {
    gamePhase = state.phase;
    carNames = state.cars;
    confirmedCars = state.confirmed_cars;
    votes = state.votes;

    // Update Screens visibility
    updateScreens();

    // Update Voting Data
    if (gamePhase === "VOTING") {
        updateVotingUI();
    }

    // Ensure sprites are loaded for confirmed cars
    updateCarSprites(carNames);
}

function updateScreens() {
    // Hide all overlays first
    Object.values(screens).forEach(el => el.classList.add("hidden"));

    if (gamePhase === "VOTING") {
        screens.voting.classList.remove("hidden");
    } else if (gamePhase === "WAITING") {
        screens.waiting.classList.remove("hidden");
    } else if (gamePhase === "COUNTDOWN") {
        screens.countdown.classList.remove("hidden");
    } else if (gamePhase === "FINISHED") {
        screens.winner.classList.remove("hidden");
    }
    // RACING has no overlay
}

function updateVotingUI() {
    for (let car in votes) {
        const voteCountEl = document.getElementById(`votes-${car}`);
        const cardEl = document.getElementById(`card-${car}`);
        if (voteCountEl) voteCountEl.innerText = votes[car];

        if (confirmedCars.includes(car)) {
            cardEl.classList.add("confirmed");
        } else {
            cardEl.classList.remove("confirmed");
        }
    }
}

function handleCountdown(value) {
    countdownDisplay.innerText = value;
}

function updatePositions(positions) {
    for (let name in positions) {
        if (cars[name]) {
            cars[name].pos = positions[name];
        }
    }
}

function showWinner(name) {
    winnerBox.innerHTML = `🏆 GANADOR: ${name.toUpperCase()} 🏆`;
    // Winner screen is handled by state update normally, but just in case
    screens.winner.classList.remove("hidden");
}

// ==========================================
// GRAPHICS
// ==========================================

function updateCarSprites(serverList) {
    serverList.forEach(name => {
        if (!cars[name]) {
            let img = new Image();
            img.src = `sprites/${name}.png`;
            cars[name] = { pos: start_pos, img: img };
        }
    });

    // Cleanup
    for (let name in cars) {
        if (!serverList.includes(name)) delete cars[name];
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Track always if we are past VOTING
    if (gamePhase !== "VOTING") {
        drawTrack();
        drawFinishLine();
        drawCars();
        drawCommands();
    } else {
         // Optional: Draw background for voting
         ctx.fillStyle = "#222";
         ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    requestAnimationFrame(draw);
}

function drawTrack() {
    ctx.fillStyle = "#333";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (carNames.length > 1) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
        ctx.lineWidth = 2;
        ctx.setLineDash([40, 30]);

        let laneWidth = canvas.width / carNames.length;

        for (let i = 1; i < carNames.length; i++) {
            let x = laneWidth * i;
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        ctx.setLineDash([]);
    }
}

function drawFinishLine() {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 10;
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    ctx.moveTo(0, finish_line);
    ctx.lineTo(canvas.width, finish_line);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawCars() {
    if (carNames.length > 0) {
        let laneWidth = canvas.width / carNames.length;

        carNames.forEach((name, index) => {
            let car = cars[name];
            if (!car) return;

            let x = (laneWidth * index) + (laneWidth / 2);
            let y = car.pos;

            drawCarSprite(ctx, car.img, x, y, name);
        });
    }
}

function drawCommands() {
    if (carNames.length > 0) {
        let laneWidth = canvas.width / carNames.length;
        ctx.save();
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";

        carNames.forEach((name, index) => {
            let x = (laneWidth * index) + (laneWidth / 2);
            // Draw tag at the top of the lane

            // Background for tag
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(x - 60, 5, 120, 30);

            // Text
            ctx.fillStyle = "#00ff00";
            ctx.fillText(`!vote ${name}`, x, 25);
        });
        ctx.restore();
    }
}

function drawCarSprite(ctx, img, x, y, name) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = "white";
    ctx.font = "bold 14px Arial";
    // Name below the car or above? Since moving up, maybe below (higher Y)
    ctx.textAlign = "center";
    ctx.fillText(name.toUpperCase(), 0, 60);

    // Rotate to face UP (0 degrees or -90 depending on source)
    // Original code rotated 270 (facing UP assuming source faces RIGHT)
    // If source faces RIGHT, 270 (-90) makes it face UP.
    // So the rotation logic might be correct already if we want it facing UP.
    // Let's verify. 270 degrees = 3/4 turn. Right -> Down -> Left -> Up. Correct.
    ctx.rotate(270 * Math.PI / 180);

    let w = 50;
    let h = 90;

    try {
        ctx.drawImage(img, -w/2, -h/2, w, h);
    } catch (e) {
        ctx.fillStyle = "red";
        ctx.fillRect(-25, -45, 50, 90);
    }

    ctx.restore();
}

draw();

</script>

</body>
</html>
