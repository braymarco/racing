<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Carrera WebSocket (Phaser)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
    <style>
        body {
            background: #222;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #game-container {
            position: relative;
            width: 1280px;
            height: 720px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            border-radius: 4px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            pointer-events: none; /* Allow clicks to pass through if needed, though mostly these block interaction */
        }

        /* Enable pointer events for voting screen so buttons/interactions work */
        #voting-screen {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        /* Voting Screen */
        .voting-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            padding: 20px;
            width: 90%;
        }
        .car-card {
            background: #444;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            position: relative;
        }
        .car-card img {
            width: 50px;
            height: auto;
            display: block;
            margin: 0 auto 10px;
        }
        .vote-count {
            font-size: 18px;
            font-weight: bold;
        }
        .confirmed-badge {
            background: #00cc00;
            color: white;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .car-card.confirmed .confirmed-badge {
            display: block;
        }
        .car-card.confirmed {
            border: 2px solid #00cc00;
        }

        /* Waiting Screen */
        .waiting-msg {
            font-size: 48px;
            text-align: center;
            color: #fff;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Countdown */
        .countdown-text {
            font-size: 150px;
            font-weight: bold;
            color: yellow;
            text-shadow: 4px 4px 0 #000;
        }

        /* Winner */
        .winner-box {
            background: rgba(0, 200, 0, 0.95);
            color: white;
            padding: 20px 50px;
            font-size: 40px;
            font-weight: bold;
            border-radius: 15px;
            border: 5px solid #fff;
            text-shadow: 2px 2px 4px #000;
        }

    </style>
</head>
<body>

<div id="game-container">
    <!-- Phaser will inject canvas here automatically if parent is set -->

    <!-- Voting Screen -->
    <div id="voting-screen" class="overlay">
        <h1>Elige tu corredor</h1>
        <div class="voting-grid" id="votingGrid"></div>
    </div>

    <!-- Waiting Screen -->
    <div id="waiting-screen" class="overlay hidden">
        <div class="waiting-msg">EN UN MOMENTO COMENZAMOS LA CARRERA</div>
    </div>

    <!-- Countdown Screen (Transparent overlay) -->
    <div id="countdown-screen" class="overlay hidden" style="background: rgba(0,0,0,0.3);">
        <div class="countdown-text" id="countdownDisplay">5</div>
    </div>

    <!-- Winner Screen -->
    <div id="winner-screen" class="overlay hidden" style="background: rgba(0,0,0,0.5);">
        <div class="winner-box" id="winnerBox"></div>
    </div>
</div>

<script>
// Assets List
const allCarNames = [
    "argentina", "bolivia", "brasil", "chile", "colombia", "costa_rica", "cuba",
    "ecuador", "el_salvador", "guatemala", "honduras", "mexico", "nicaragua",
    "panama", "paraguay", "peru", "uruguay", "usa", "venezuela"
];

// DOM Elements
const screens = {
    voting: document.getElementById("voting-screen"),
    waiting: document.getElementById("waiting-screen"),
    countdown: document.getElementById("countdown-screen"),
    winner: document.getElementById("winner-screen")
};
const votingGrid = document.getElementById("votingGrid");
const countdownDisplay = document.getElementById("countdownDisplay");
const winnerBox = document.getElementById("winnerBox");

// Global Game State (Synced with Server)
let gameState = {
    phase: "VOTING",
    cars: [], // list of car names in lanes
    confirmedCars: [],
    votes: {}
};

// WebSocket
let ws = new WebSocket("ws://" + window.location.host + "/ws");

// Phaser Game Configuration
const config = {
    type: Phaser.AUTO,
    width: 1280,
    height: 720,
    parent: 'game-container',
    backgroundColor: '#333333',
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

let game = new Phaser.Game(config);
let sceneContext; // Reference to the scene
let carSprites = {}; // Map: name -> Sprite
let trackLines = [];
let finishLineGraphic;
let startPos = 50;
let finishLinePos = 1150;

// Initialize Voting Grid
allCarNames.forEach(name => {
    const card = document.createElement("div");
    card.className = "car-card";
    card.id = `card-${name}`;
    card.innerHTML = `
        <img src="sprites/${name}.png" alt="${name}">
        <div>${name.toUpperCase()}</div>
        <div class="vote-count" id="votes-${name}">0</div>
        <div class="confirmed-badge">CONFIRMADO PARA LA CARRERA</div>
    `;
    votingGrid.appendChild(card);
});


// Phaser Functions
function preload() {
    sceneContext = this;
    // Load all car images
    allCarNames.forEach(name => {
        this.load.image(name, `sprites/${name}.png`);
    });
}

function create() {
    // Create static graphics (track lines, finish line)
    finishLineGraphic = this.add.graphics();

    // Initial Draw
    drawTrack(this);
}

function update() {
    // Game loop logic if needed (e.g. interpolation), but we are mostly event driven by WS
}

function drawTrack(scene) {
    // Clear old graphics
    if (trackLines.length > 0) {
        trackLines.forEach(line => line.destroy());
        trackLines = [];
    }
    finishLineGraphic.clear();

    // Draw Finish Line
    finishLineGraphic.lineStyle(10, 0xffffff, 1);
    // finish line is a vertical line
    // Dashed line simulation
    for (let i = 0; i < 720; i += 40) {
        finishLineGraphic.lineBetween(finishLinePos, i, finishLinePos, i + 20);
    }

    // If we have cars, draw lane dividers
    if (gameState.cars.length > 1) {
        let laneHeight = 720 / gameState.cars.length;

        for (let i = 1; i < gameState.cars.length; i++) {
            let y = laneHeight * i;
            let line = scene.add.graphics();
            line.lineStyle(2, 0xffffff, 0.3);

            // Dashed horizontal line
            for (let x = 0; x < 1280; x += 70) {
                line.lineBetween(x, y, x + 40, y);
            }
            trackLines.push(line);
        }
    }
}

// Helper to sync Phaser sprites with Game State
function updatePhaserCars(positions) {
    if (!sceneContext) return;

    const currentCarNames = gameState.cars;
    const laneHeight = 720 / Math.max(1, currentCarNames.length);

    // Add new cars or update existing
    currentCarNames.forEach((name, index) => {
        let xPos = positions && positions[name] ? positions[name] : startPos;
        let yPos = (laneHeight * index) + (laneHeight / 2);

        if (!carSprites[name]) {
            // Create sprite
            let sprite = sceneContext.add.sprite(xPos, yPos, name);
            sprite.angle = 0; // Default facing right if image is facing right.
            // If original image faces DOWN (as per old code rotate 270), we need to rotate -90 or 270?
            // Canvas rotate(270 deg) = -90 deg.
            // If image faces DOWN (90 deg), -90 makes it 0 (Right).
            // Phaser angle is in degrees.
            sprite.angle = -90;

            sprite.setDisplaySize(50, 90); // Based on old code w=50, h=90 (swapped because of rotation?)
            // Wait, drawImage(img, -w/2, -h/2, w, h) where w=50, h=90.
            // If rotated 270 (-90), the 90 dimension is along X axis? No.
            // Let's check bounds.

            // Create Text Label
            let text = sceneContext.add.text(xPos, yPos - 35, name.toUpperCase(), {
                font: "bold 14px Arial",
                fill: "#ffffff"
            });
            text.setOrigin(0.5, 1);

            carSprites[name] = { sprite: sprite, text: text };
        }

        // Update Position
        let carObj = carSprites[name];
        carObj.sprite.x = xPos;
        carObj.sprite.y = yPos;

        // Adjust Text position
        carObj.text.x = xPos;
        carObj.text.y = yPos - 25; // Offset slightly above

        // Text alignment logic from old code
        if (xPos < 60) {
            carObj.text.setOrigin(0, 1);
            carObj.text.x = xPos - 20;
        } else {
            carObj.text.setOrigin(0.5, 1);
        }
    });

    // Remove cars that are no longer in the race
    for (let name in carSprites) {
        if (!currentCarNames.includes(name)) {
            carSprites[name].sprite.destroy();
            carSprites[name].text.destroy();
            delete carSprites[name];
        }
    }
}

// WebSocket Handling
ws.onmessage = (event) => {
    let msg = JSON.parse(event.data);

    if (msg.type === "state_update") {
        handleStateUpdate(msg);
    } else if (msg.type === "positions") {
        updatePhaserCars(msg.data);
    } else if (msg.type === "countdown") {
        handleCountdown(msg.value);
    } else if (msg.type === "winner") {
        showWinner(msg.data);
    }
};

function handleStateUpdate(state) {
    let oldPhase = gameState.phase;
    let oldCars = gameState.cars.length;

    gameState.phase = state.phase;
    gameState.cars = state.cars;
    gameState.confirmedCars = state.confirmed_cars;
    gameState.votes = state.votes;

    // Update Screens visibility
    updateScreens();

    // Update Voting Data
    if (gameState.phase === "VOTING") {
        updateVotingUI();
    }

    // If cars changed (e.g. waiting phase started), redraw track lines
    if (gameState.phase === "WAITING" || (gameState.phase === "RACING" && oldPhase !== "RACING")) {
        if (sceneContext) {
            drawTrack(sceneContext);
            updatePhaserCars(); // Initialize sprites at start position
        }
    }

    // Ensure sprites exist/removed based on state
    if (sceneContext) updatePhaserCars();
}

function updateScreens() {
    // Hide all overlays first
    Object.values(screens).forEach(el => el.classList.add("hidden"));

    if (gameState.phase === "VOTING") {
        screens.voting.classList.remove("hidden");
    } else if (gameState.phase === "WAITING") {
        screens.waiting.classList.remove("hidden");
    } else if (gameState.phase === "COUNTDOWN") {
        screens.countdown.classList.remove("hidden");
    } else if (gameState.phase === "FINISHED") {
        screens.winner.classList.remove("hidden");
    }
}

function updateVotingUI() {
    for (let car in gameState.votes) {
        const voteCountEl = document.getElementById(`votes-${car}`);
        const cardEl = document.getElementById(`card-${car}`);
        if (voteCountEl) voteCountEl.innerText = gameState.votes[car];

        if (gameState.confirmedCars.includes(car)) {
            cardEl.classList.add("confirmed");
        } else {
            cardEl.classList.remove("confirmed");
        }
    }
}

function handleCountdown(value) {
    countdownDisplay.innerText = value;
}

function showWinner(name) {
    winnerBox.innerHTML = `🏆 GANADOR: ${name.toUpperCase()} 🏆`;
    screens.winner.classList.remove("hidden");
}

</script>

</body>
</html>
